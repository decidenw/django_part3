info:
  name: 2. Get Snippet Detail
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/snippets/{{snippet_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Snippet ID matches environment variable", function() {
          const data = res.getBody();
          expect(data.id).to.equal(Number(bru.getEnvVar("snippet_id")));
          expect(data).to.have.property("highlight");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
